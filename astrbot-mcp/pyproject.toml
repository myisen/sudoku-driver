[project]
name = "astrbot-mcp"
version = "0.1.0"
description = "MCP server for managing AstrBot instances (bots, providers, plugins, personas, sessions, monitoring)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
]

[project.scripts]
astrbot-mcp = "astrbot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrbot_mcp"]
